<main class="content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">YOUR COLLECTION</p>
            <h1>My Decks</h1>
            <p class="subtitle">
                Build, customize, and master your decks.
            </p>
        </div>

        <button class="create-button" disabled title="Deck creation is coming in the next step">
            + Create Deck
        </button>
    </section>

    <section class="decks-grid">
        @for (deck of decks; track deck.id) {
        <article class="deck-card">
            <div class="deck-art">
                <img [src]="deck.image" [alt]="deck.commander" />

                <span class="format-tag">COMMANDER</span>
            </div>

            <div class="deck-info">
                <h2>{{ deck.name }}</h2>
                <p>{{ deck.commander }}</p>

                <div class="deck-footer">
                    <div class="mana-colors">
                        @for (color of deck.colors; track color) {
                        <span class="mana" [class]="'mana-' + color">
                            {{ color }}
                        </span>
                        }
                    </div>

                    <span class="card-count">
                        {{ deck.cardCount }}/100 Cards
                    </span>
                </div>
            </div>
        </article>
        }
    </section>
</main>
