<main class="content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">YOUR COLLECTION</p>
            <p class="subtitle">
                Manage all of your decks.
            </p>
        </div>
        <a class="create-button" routerLink="/decks/new">
            + Create Deck
        </a>
    </section>
    <section class="decks-grid">
        @for (deck of decks(); track deck.id) {
        <a class="deck-card deck-link" [routerLink]="['/decks', deck.id]">
            <div class="deck-info">
                <h2>{{ deck.name }}</h2>
                <p>{{ deck.cards.length }} cards</p>
                <p>
                    {{ deck.commander ? 'Commander selected' : 'No commander yet' }}
                </p>
            </div>
        </a>
        } @empty {
        <p class="subtitle">
            No decks yet. Create your first Commander deck!
        </p>
        }
    </section>

</main>
