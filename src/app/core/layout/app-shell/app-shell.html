<div class="app-shell">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">✦</span>
            <span>CARTAS</span>
        </div>

        <div class="profile-icon">S</div>
    </header>

    <router-outlet />


    <nav class="bottom-nav">
        <div class="nav-content">
            <!-- Deck Library -->
            <a routerLink="/decks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }"
                class="nav-item" aria-label="My Decks">

                <span class="nav-icon">▦</span>
                <span>Decks</span>
            </a>

            <!-- Card Search -->
            <a routerLink="/search" routerLinkActive="active" class="nav-item" aria-label="Search Cards">

                <span class="nav-icon">⌕</span>
                <span>Search</span>
            </a>

        </div>
    </nav>

</div>
